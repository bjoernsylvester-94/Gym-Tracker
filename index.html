<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F1115">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 10px; background: #0F1115; color: #E8E9EB; }
        .container { max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #fff; font-weight: 700; letter-spacing: -0.3px; }
        .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .tab-btn { background: #21252C; border: none; padding: 10px 4px; border-radius: 10px; cursor: pointer; font-size: 0.8em; font-weight: 600; color: #C7CAD1; }
        .tab-btn.active { background: linear-gradient(135deg, #8A6D2E, #C9A34A); color: #fff; box-shadow: 0 0 12px rgba(138,109,46,0.35); }
        .uebung-grid { display: grid; gap: 6px; margin-bottom: 15px; }
        .uebung-btn { background: #191C21; border: 1px solid #262A31; padding: 12px; border-radius: 12px; cursor: pointer; text-align: left; width: 100%; color: #E8E9EB; }
        .uebung-btn.active { border: 2px solid #C9A34A; background: #23200F; color: #E8C170; font-weight: 600; }
        .uebung-btn.done { border-color: #2FA85A; background: #14201A; color: #6FCF97; font-weight: 600; }
        
        .input-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #2A2E35; border-radius: 8px; box-sizing: border-box; background: #191C21; color: #E8E9EB; }
        select { width: 100%; padding: 10px; border: 1px solid #2A2E35; border-radius: 8px; box-sizing: border-box; margin-bottom: 8px; font-size: 0.9em; background: #191C21; color: #E8E9EB; }
        #add-btn { min-width: 50px; padding: 12px; border-radius: 8px; border:none; background: linear-gradient(135deg, #8A6D2E, #C9A34A); color:white; font-weight:bold; cursor: pointer; }

        .main-btn { border: none; padding: 13px; width: 100%; border-radius: 12px; font-weight: 700; margin-top: 8px; cursor: pointer; color: #fff; box-sizing: border-box; }
        .info-box { background: #191C21; padding: 12px; margin: 10px 0; border-radius: 14px; border: 1px solid #262A31; }
        .info-box-label { font-size: 0.78em; font-weight: 700; color: #8A8F98; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #191C21; border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #262A31; font-size: 0.9em; color: #E8E9EB; }
        th { background: #21252C; color: #8A8F98; }
        .sum-box { background: linear-gradient(135deg, #8A6D2E, #C9A34A); color: white; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 0.9em; }
        .checkbox-gruppe { margin-bottom: 10px; }
        .checkbox-gruppe-titel { font-weight: bold; font-size: 0.85em; margin: 8px 0 4px; color: #C7CAD1; }
        .checkbox-zeile { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.9em; color: #E8E9EB; }
        .checkbox-zeile input { flex: none; width: auto; padding: 0; }
        .plan-verwaltung-zeile { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #262A31; }
        .klein-btn { padding: 6px 10px; border-radius: 6px; border: none; font-size: 0.8em; font-weight: bold; cursor: pointer; color: white; }
        .badge { display: inline-block; background: linear-gradient(135deg, #8A6D2E, #C9A34A); color: #fff; font-size: 0.7em; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 6px; vertical-align: middle; text-transform: none; }
        .chip { display: inline-block; background: #21252C; color: #C7CAD1; font-size: 0.78em; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin: 2px 4px 2px 0; }
        .tag-uebungen { display: flex; flex-wrap: wrap; gap: 6px; }
        .uebung-chip { background: #21252C; border-radius: 10px; padding: 6px 10px; }
        .uebung-chip-name { font-size: 0.78em; font-weight: 700; color: #E8E9EB; }
        .uebung-chip-saetze { font-size: 0.72em; color: #8A8F98; margin-top: 1px; }
        .historie-tag { background: #191C21; border: 1px solid #262A31; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
        .historie-tag summary { padding: 12px; font-weight: 700; cursor: pointer; list-style: none; color: #E8E9EB; }
        .historie-tag summary::-webkit-details-marker { display: none; }
        .historie-tag summary::after { content: '▸'; float: right; color: #8A8F98; transition: transform 0.2s ease; }
        .historie-tag[open] summary::after { transform: rotate(90deg); }
        .historie-tag-info { color: #8A8F98; font-weight: 400; font-size: 0.82em; margin-left: 6px; }
        .historie-eintrag { padding: 10px 12px; border-top: 1px solid #262A31; font-size: 0.9em; color: #E8E9EB; }
        .dashboard-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .dashboard-stat { background: #21252C; border-radius: 12px; padding: 10px; text-align: center; }
        .dashboard-stat-value { font-size: 1.4em; font-weight: 800; color: #fff; }
        .dashboard-stat-label { font-size: 0.72em; color: #8A8F98; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px; }
        .dashboard-pr { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.85em; padding: 6px 0; border-top: 1px solid #262A31; color: #E8E9EB; }
        .dashboard-pr-datum { color: #8A8F98; font-size: 0.8em; white-space: nowrap; margin-left: 8px; }
        .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #8A6D2E, #C9A34A); color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.9em; box-shadow: 0 4px 14px rgba(138,109,46,0.35); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; white-space: nowrap; }
        .toast.show { opacity: 1; }
    </style>
<script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
    
    </head>

<body>

<div id="toast" class="toast"></div>

<div class="container">
    <h2>Gym Tracker</h2>

    <div class="info-box" id="dashboard"></div>

    <div class="info-box" style="padding: 8px;">
        <div class="info-box-label" id="planLabel">Trainingsplan wählen</div>
        <div class="tabs" id="planContainer"></div>
        <button class="main-btn" onclick="zeigePlanverwaltung()" style="background: #21252C; margin-top: 8px; font-size: 0.85em; padding: 8px;">Pläne verwalten</button>
    </div>

    <div id="planVerwaltungBereich" style="display:none;"></div>

    <div class="tabs" id="tabContainer"></div>
    <div id="gruppenContainer"></div>

    <div id="eingabeBereich" style="display:none;">
        <div id="letzterStand" class="info-box"></div>
        <div class="input-row">
            <input type="number" id="wdh" placeholder="Wdh">
            <input type="number" id="kg" placeholder="kg">
            <button id="add-btn" onclick="satzHinzufuegen()">+</button>
        </div>
        <div id="aktuellesSetLog" style="margin: 8px 0;"></div>
        <button class="main-btn" onclick="speichern()" style="background: #28a745;">Übung speichern</button>
    </div>

    <div id="heutigesWorkoutLog" style="display:none;">
        <h3>Heute bereits trainiert:</h3>
        <table id="workoutTable">
            <thead><tr><th>Übung</th><th>Sätze</th><th></th></tr></thead>
            <tbody></tbody>
        </table>
        <div id="gesamtZaehler" class="sum-box"></div>
    </div>

    <button class="main-btn" onclick="trainingAbschliessen()" style="background: linear-gradient(135deg, #8A6D2E, #C9A34A);">Training beenden</button>
    <button class="main-btn" onclick="zeigeHistorie()" style="background: #21252C;">Historie anzeigen</button>
    <button class="main-btn" onclick="zeigeWochenuebersicht()" style="background: linear-gradient(135deg, #8A6D2E, #C9A34A);">Wochenübersicht</button>

    <div style="display:flex; gap:8px;">
        <button class="main-btn" onclick="datenExportieren()" style="background: #21252C; flex:1;">Daten exportieren</button>
        <button class="main-btn" onclick="document.getElementById('importFile').click()" style="background: #21252C; flex:1;">Daten importieren</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="datenImportieren(event)">

    <button class="main-btn" onclick="loescheDaten()" style="background: #D9534F;">Daten zurücksetzen</button>
    
    <div id="historienBereich"></div>
    <div id="wochenBereich" style="display:none;"></div>
</div>

<script>
    const datenbank = {
        "Brust": ["Brustpresse (Maschine)", "Butterfly (Maschine)", "Cable Crossovers (Flys)", "Schrägbankdrücken (Smith Machine)"],
        "Rücken": ["Iso-Laterales Rudern", "Latzug (Maschine)", "Latzug Kabelzug", "Rückenstrecken (Maschine)", "Sitzendes Rudern am Kabelzug - V-Griff (Kabel)"],
        "Beine": ["Beinbeuger liegend", "Beinbeuger sitzend", "Beinpresse", "Beinpresse 45°", "Beinstrecker sitzend", "Hackenschmidt Squat (Maschine)", "Wadendrücken in Beinpresse"],
        "Schultern": ["Schulterpresse sitzend (Maschine)", "Seitheben (Maschine)", "Reverse Butterfly (Maschine)"],
        "Arme": ["Bizepscurl (Maschine)", "Hammer Curl (Kurzhantel)", "Cable Curls hinter dem Rücken", "Trizepsdrücken mit dem Seil", "Trizepsmaschine", "Trizepsstrecken a. Kabel", "einarmiges Trizepsdrücken"],
        "Bauch": ["Crunch (Maschine)", "Rotationsmaschine"]
    };

    // Trainingspläne werden jetzt in der App verwaltet und im localStorage gespeichert.
    // Beim allerersten Start werden drei Beispielpläne angelegt, die danach frei bearbeitet werden können.
    let plaene = JSON.parse(localStorage.getItem('plaene'));
    if (!plaene) {
        plaene = {
            "Plan A – Push": ["Brustpresse (Maschine)", "Schulterpresse sitzend (Maschine)", "Trizepsdrücken mit dem Seil"],
            "Plan B – Pull": ["Latzug (Maschine)", "Sitzendes Rudern am Kabelzug - V-Griff (Kabel)", "Bizepscurl (Maschine)"],
            "Plan C – Beine": ["Beinpresse", "Beinstrecker sitzend", "Beinbeuger liegend"]
        };
        localStorage.setItem('plaene', JSON.stringify(plaene));
    }

    let aktiveUebung = "";
    let aktuelleSätze = [];
    let heutigesWorkout = [];
    let aktiverPlan = null;
    let aktuelleAnsicht = null; // 'plan' oder 'gruppe' – getrennt vom aktiverPlan, damit der Plan-Kontext beim Stöbern in Muskelgruppen erhalten bleibt
    let trainingsStart = null;

    // Laufendes Training bei jeder Änderung sichern, damit ein Absturz/Neuladen nichts verloren geht
    function speichereAktuellesTraining() {
        if (heutigesWorkout.length > 0) {
            localStorage.setItem('aktuellesTraining', JSON.stringify({
                heutigesWorkout,
                trainingsStart: trainingsStart ? trainingsStart.toISOString() : null
            }));
        } else {
            localStorage.removeItem('aktuellesTraining');
        }
    }

    // Beim Laden prüfen, ob ein unvollendetes Training vorliegt, und es wiederherstellen
    (function stelleLaufendesTrainingWieder() {
        try {
            const gespeichert = JSON.parse(localStorage.getItem('aktuellesTraining') || 'null');
            if (gespeichert && Array.isArray(gespeichert.heutigesWorkout) && gespeichert.heutigesWorkout.length > 0) {
                heutigesWorkout = gespeichert.heutigesWorkout;
                trainingsStart = gespeichert.trainingsStart ? new Date(gespeichert.trainingsStart) : new Date();
            }
        } catch (e) { /* beschädigter Eintrag wird ignoriert */ }
    })();

    function formatDauer(minuten) {
        if (minuten === undefined || minuten === null) return '';
        if (minuten < 60) return `${minuten} Min`;
        const std = Math.floor(minuten / 60);
        const rest = minuten % 60;
        return rest > 0 ? `${std} Std ${rest} Min` : `${std} Std`;
    }

    function findGruppe(uebung) {
        for (const g in datenbank) {
            if (datenbank[g].includes(uebung)) return g;
        }
        return "Sonstige";
    }

    function zeigeToast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.add('show');
        clearTimeout(window._toastTimeout);
        window._toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // Prüft, ob in den neuen Sätzen entweder ein höheres Gewicht als je zuvor steckt,
    // oder bei gleichem Gewicht mehr Wiederholungen als je zuvor geschafft wurden.
    function pruefeBestleistung(uebung, neueSaetze) {
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const bisherigeSaetze = logs.filter(l => l.uebung === uebung).flatMap(l => l.saetze);
        if (bisherigeSaetze.length === 0) return null;

        const bisherigesMaxKg = Math.max(...bisherigeSaetze.map(s => s.kg));
        const neuesMaxKg = Math.max(...neueSaetze.map(s => s.kg));

        if (neuesMaxKg > bisherigesMaxKg) {
            return `🏆 Neue Bestleistung: ${neuesMaxKg} kg!`;
        }

        for (const neu of neueSaetze) {
            const bisherigeWdhBeiGewicht = bisherigeSaetze.filter(s => s.kg === neu.kg).map(s => s.wdh);
            if (bisherigeWdhBeiGewicht.length === 0) continue;
            const bisherigesMaxWdh = Math.max(...bisherigeWdhBeiGewicht);
            if (neu.wdh > bisherigesMaxWdh) {
                return `🏆 Neue Bestleistung: ${neu.wdh}x${neu.kg}kg (mehr Wdh als je zuvor)!`;
            }
        }

        return null;
    }

    const tabContainer = document.getElementById('tabContainer');
    Object.keys(datenbank).forEach(g => {
        let b = document.createElement('button');
        b.className = 'tab-btn'; b.innerHTML = g;
        b.onclick = () => zeigeGruppe(g, b);
        tabContainer.appendChild(b);
    });

    function renderPlanTabs() {
        const planContainer = document.getElementById('planContainer');
        planContainer.innerHTML = '';
        Object.keys(plaene).forEach(p => {
            let b = document.createElement('button');
            b.className = 'tab-btn'; b.innerHTML = p;
            b.onclick = () => zeigePlan(p, b);
            planContainer.appendChild(b);
        });
    }
    renderPlanTabs();
    renderDashboard();

    if (heutigesWorkout.length > 0) {
        document.getElementById('heutigesWorkoutLog').style.display = 'block';
        renderHeutigesWorkout();
        updateGesamtZaehler();
        zeigeToast('↩️ Unvollendetes Training wiederhergestellt');
    }

    function zeigePlan(planName, btn) {
        aktiverPlan = planName;
        aktuelleAnsicht = 'plan';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPlanUebungen(planName);
    }

    function renderPlanUebungen(planName) {
        const container = document.getElementById('gruppenContainer');
        container.innerHTML = '';
        (plaene[planName] || []).forEach(u => {
            let b = document.createElement('button');
            const erledigt = heutigesWorkout.some(w => w.uebung === u);
            b.className = erledigt ? 'uebung-btn done' : 'uebung-btn';
            b.innerHTML = erledigt ? `✓ ${u}` : u;
            b.onclick = () => waehleUebung(u, b);
            container.appendChild(b);
        });
        const hinweis = document.createElement('div');
        hinweis.style.cssText = 'font-size:0.8em; color:#666; text-align:center; margin-top:8px;';
        hinweis.textContent = 'Tipp: Oben eine Muskelgruppe wählen, um Übungen zu tauschen oder zu ergänzen.';
        container.appendChild(hinweis);
        updatePlanBadge();
    }

    function updatePlanBadge() {
        const label = document.getElementById('planLabel');
        if (!aktiverPlan) { label.innerHTML = 'Trainingsplan wählen'; return; }
        const uebungen = plaene[aktiverPlan] || [];
        const erledigt = uebungen.filter(u => heutigesWorkout.some(w => w.uebung === u)).length;
        label.innerHTML = `Trainingsplan <span class="badge">${erledigt}/${uebungen.length} erledigt</span>`;
    }

    function zeigeGruppe(gruppe, btn) {
        aktuelleAnsicht = 'gruppe';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const container = document.getElementById('gruppenContainer');
        container.innerHTML = '';
        datenbank[gruppe].forEach(u => {
            let b = document.createElement('button');
            b.className = 'uebung-btn';
            b.innerHTML = u;
            b.onclick = () => waehleUebung(u, b);
            container.appendChild(b);
        });
    }

    let bearbeiteterPlanName = null;

    function zeigePlanverwaltung() {
        const b = document.getElementById('planVerwaltungBereich');
        const wirdGeoeffnet = b.style.display === 'none';
        if (!wirdGeoeffnet) { b.style.display = 'none'; return; }
        b.style.display = 'block';
        renderPlanverwaltungListe();
    }

    function renderPlanverwaltungListe() {
        const b = document.getElementById('planVerwaltungBereich');
        const zeilen = Object.keys(plaene).map(name => `
            <div class="plan-verwaltung-zeile">
                <span>${name} <span style="color:#999; font-size:0.8em;">(${plaene[name].length} Übungen)</span></span>
                <span>
                    <button class="klein-btn" style="background: linear-gradient(135deg, #8A6D2E, #C9A34A);" onclick="planEditorOeffnen('${name.replace(/'/g, "\\'")}')">Bearbeiten</button>
                    <button class="klein-btn" style="background:#D9534F;" onclick="planLoeschen('${name.replace(/'/g, "\\'")}')">Löschen</button>
                </span>
            </div>`).join('') || "<p>Noch keine Pläne angelegt.</p>";

        b.innerHTML = `
            <div class="info-box">
                <h3 style="margin-top:0;">Pläne verwalten</h3>
                ${zeilen}
                <button class="main-btn" style="background:#28a745;" onclick="planEditorOeffnen()">+ Neuer Plan</button>
                <div id="planEditor"></div>
            </div>`;
    }

    function planEditorOeffnen(name) {
        bearbeiteterPlanName = name || null;
        const vorhandeneUebungen = name ? plaene[name] : [];

        const gruppenHtml = Object.keys(datenbank).map(gruppe => `
            <div class="checkbox-gruppe">
                <div class="checkbox-gruppe-titel">${gruppe}</div>
                ${datenbank[gruppe].map(u => `
                    <label class="checkbox-zeile">
                        <input type="checkbox" value="${u}" ${vorhandeneUebungen.includes(u) ? 'checked' : ''}>
                        ${u}
                    </label>`).join('')}
            </div>`).join('');

        document.getElementById('planEditor').innerHTML = `
            <input type="text" id="planNameInput" placeholder="Plan-Name" value="${name ? name.replace(/"/g, '&quot;') : ''}" style="margin-top:10px;">
            <div style="max-height: 260px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; padding: 8px;">
                ${gruppenHtml}
            </div>
            <button class="main-btn" style="background:#28a745;" onclick="planSpeichern()">Speichern</button>
            <button class="main-btn" style="background:#21252C;" onclick="planEditorSchliessen()">Abbrechen</button>`;
    }

    function planEditorSchliessen() {
        bearbeiteterPlanName = null;
        document.getElementById('planEditor').innerHTML = '';
    }

    function planSpeichern() {
        const name = document.getElementById('planNameInput').value.trim();
        if (!name) { alert('Bitte einen Namen für den Plan eingeben.'); return; }

        const ausgewaehlt = [...document.querySelectorAll('#planEditor input[type="checkbox"]:checked')].map(cb => cb.value);
        if (ausgewaehlt.length === 0) { alert('Bitte mindestens eine Übung auswählen.'); return; }

        if (bearbeiteterPlanName && bearbeiteterPlanName !== name) {
            delete plaene[bearbeiteterPlanName];
        }
        plaene[name] = ausgewaehlt;
        localStorage.setItem('plaene', JSON.stringify(plaene));

        bearbeiteterPlanName = null;
        renderPlanTabs();
        renderPlanverwaltungListe();
    }

    function planLoeschen(name) {
        if (!confirm(`Plan "${name}" wirklich löschen?`)) return;
        delete plaene[name];
        localStorage.setItem('plaene', JSON.stringify(plaene));
        renderPlanTabs();
        renderPlanverwaltungListe();
    }

    function waehleUebung(name, btn) {
        document.querySelectorAll('.uebung-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        aktiveUebung = name;
        aktuelleSätze = [];
        document.getElementById('eingabeBereich').style.display = 'block';
        document.getElementById('aktuellesSetLog').innerHTML = '';
        
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const eintraege = logs.filter(l => l.uebung === name);
        const letzte = eintraege.slice(-1)[0];

        let bestSatz = null;
        eintraege.forEach(e => e.saetze.forEach(s => {
            if (!bestSatz || s.kg > bestSatz.kg) bestSatz = s;
        }));

        let stand = letzte ?
            `<strong>Letztes Mal:</strong> ${letzte.saetze.map(s => `${s.wdh}x${s.kg}kg`).join(', ')}` : "Keine Historie.";
        if (bestSatz) {
            stand += `<br><strong>Bestwert:</strong> ${bestSatz.wdh}x${bestSatz.kg}kg`;
        }
        document.getElementById('letzterStand').innerHTML = stand;

        // Startgewicht vorschlagen: der erste Satz (meist der leichteste/Aufwärmsatz) des letzten Trainings
        if (letzte && letzte.saetze.length > 0) {
            document.getElementById('wdh').value = letzte.saetze[0].wdh;
            document.getElementById('kg').value = letzte.saetze[0].kg;
        } else {
            document.getElementById('wdh').value = '';
            document.getElementById('kg').value = '';
        }
    }

    function satzHinzufuegen() {
        const wdh = parseInt(document.getElementById('wdh').value);
        const kg = parseInt(document.getElementById('kg').value);
        if(isNaN(wdh) || isNaN(kg)) return;
        aktuelleSätze.push({wdh, kg});
        
        const logDiv = document.getElementById('aktuellesSetLog');
        logDiv.innerHTML = `
            <div style="background: #21252C; color: #E8E9EB; padding: 5px; border-radius: 4px; text-align: center; font-weight: bold; margin-bottom: 5px;">
                Satz ${aktuelleSätze.length} erfasst
            </div>
            <div style="font-size: 0.85em; text-align: center;">
                ${aktuelleSätze.map((s, i) => `${i+1}. ${s.wdh}x${s.kg}kg`).join(' | ')}
            </div>`;
        document.getElementById('wdh').value = ''; document.getElementById('kg').value = '';
    }

    function renderHeutigesWorkout() {
        const tableBody = document.querySelector('#workoutTable tbody');
        tableBody.innerHTML = '';
        heutigesWorkout.forEach((item, index) => {
            const row = tableBody.insertRow();
            row.insertCell(0).innerHTML = item.uebung;
            row.insertCell(1).innerHTML = item.saetze.map(s => s.wdh + 'x' + s.kg + 'kg').join(', ');
            row.insertCell(2).innerHTML = `
                <button class="klein-btn" style="background: linear-gradient(135deg, #8A6D2E, #C9A34A);" onclick="heutigeUebungBearbeiten(${index})">✏️</button>
                <button class="klein-btn" style="background:#D9534F;" onclick="heutigeUebungLoeschen(${index})">🗑️</button>`;
        });
    }

    function saetzeZuString(saetze) {
        return saetze.map(s => `${s.wdh}x${s.kg}`).join(', ');
    }

    function stringZuSaetze(str) {
        return str.split(',').map(t => t.trim()).filter(Boolean).map(t => {
            const teile = t.toLowerCase().replace('kg', '').split('x').map(x => parseFloat(x.trim()));
            return { wdh: teile[0] || 0, kg: teile[1] || 0 };
        }).filter(s => s.wdh > 0);
    }

    function heutigeUebungBearbeiten(index) {
        const item = heutigesWorkout[index];
        const eingabe = prompt(`Sätze für "${item.uebung}" bearbeiten (Format: Wdh x kg, z.B. 10x40, 8x45):`, saetzeZuString(item.saetze));
        if (eingabe === null) return;
        const neu = stringZuSaetze(eingabe);
        if (neu.length === 0) { alert('Keine gültigen Sätze erkannt.'); return; }
        heutigesWorkout[index].saetze = neu;
        renderHeutigesWorkout();
        updateGesamtZaehler();
        updatePlanBadge();
        speichereAktuellesTraining();
        if (aktuelleAnsicht === 'plan' && aktiverPlan) renderPlanUebungen(aktiverPlan);
    }

    function heutigeUebungLoeschen(index) {
        if (!confirm(`"${heutigesWorkout[index].uebung}" aus dem heutigen Training entfernen?`)) return;
        heutigesWorkout.splice(index, 1);
        renderHeutigesWorkout();
        updateGesamtZaehler();
        updatePlanBadge();
        speichereAktuellesTraining();
        if (heutigesWorkout.length === 0) document.getElementById('heutigesWorkoutLog').style.display = 'none';
        if (aktuelleAnsicht === 'plan' && aktiverPlan) renderPlanUebungen(aktiverPlan);
    }

    function speichern() {
        if(aktuelleSätze.length === 0) return;

        const neueBestleistung = pruefeBestleistung(aktiveUebung, aktuelleSätze);

        if (!trainingsStart) trainingsStart = new Date();

        heutigesWorkout.push({uebung: aktiveUebung, gruppe: findGruppe(aktiveUebung), saetze: [...aktuelleSätze]});
        speichereAktuellesTraining();
        
        document.getElementById('heutigesWorkoutLog').style.display = 'block';
        renderHeutigesWorkout();
        updateGesamtZaehler();
        
        document.getElementById('eingabeBereich').style.display = 'none';
        document.querySelectorAll('.uebung-btn').forEach(b => b.classList.remove('active'));

        if (neueBestleistung) {
            zeigeToast(neueBestleistung);
        }

        // Manuell (über eine Muskelgruppe) hinzugefügte Übung, die nicht Teil des aktiven Plans ist: optional dauerhaft übernehmen
        if (aktiverPlan && !(plaene[aktiverPlan] || []).includes(aktiveUebung)) {
            if (confirm(`"${aktiveUebung}" ist nicht Teil von "${aktiverPlan}". Dauerhaft zum Plan hinzufügen?`)) {
                plaene[aktiverPlan].push(aktiveUebung);
                localStorage.setItem('plaene', JSON.stringify(plaene));
            }
        }

        if (aktuelleAnsicht === 'plan' && aktiverPlan) renderPlanUebungen(aktiverPlan);
        else updatePlanBadge();
    }

    function updateGesamtZaehler() {
        let gesamtSaetze = 0;
        let gesamtGewicht = 0;
        heutigesWorkout.forEach(u => {
            u.saetze.forEach(s => {
                gesamtSaetze++;
                gesamtGewicht += (s.wdh * s.kg);
            });
        });
        const dauerText = trainingsStart ? ` | seit ${formatDauer(Math.round((new Date() - trainingsStart) / 60000))}` : '';
        document.getElementById('gesamtZaehler').innerHTML = 
            `<strong>Gesamt heute:</strong> ${gesamtSaetze} Sätze | ${gesamtGewicht} kg bewegt${dauerText}`;
    }

    function trainingAbschliessen() {
        const log = JSON.parse(localStorage.getItem('logs')) || [];
        const jetzt = new Date();
        const dauerMinuten = trainingsStart ? Math.max(1, Math.round((jetzt - trainingsStart) / 60000)) : null;
        heutigesWorkout.forEach(item => log.push({
            ...item,
            id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            datum: jetzt.toLocaleDateString('de-DE'),
            datumISO: jetzt.toISOString().slice(0, 10),
            dauerMinuten
        }));
        localStorage.setItem('logs', JSON.stringify(log));
        localStorage.removeItem('aktuellesTraining');
        location.reload();
    }

    // Dauer-Anzeige tickt auch ohne neue Eingabe mit
    setInterval(() => { if (trainingsStart) updateGesamtZaehler(); }, 60000);

    // Ermittelt zu einem Log-Eintrag das Datum als Date-Objekt (auch für ältere Einträge ohne datumISO)
    function parseLogDatum(l) {
        if (l.datumISO) return new Date(l.datumISO);
        const teile = (l.datum || '').split('.');
        if (teile.length === 3) return new Date(`${teile[2]}-${teile[1]}-${teile[0]}`);
        return new Date();
    }

    // Montag der Woche für ein gegebenes Datum
    function wochenStart(datum) {
        const d = new Date(datum);
        const tag = (d.getDay() + 6) % 7; // Montag = 0
        d.setDate(d.getDate() - tag);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    // Anzahl Wochen in Folge (bis zur aktuellen bzw. zuletzt trainierten Woche) mit mind. einem Training
    function berechneWochenStreak() {
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        if (logs.length === 0) return 0;

        const wochenMitTraining = new Set(logs.map(l => wochenStart(parseLogDatum(l)).toISOString().slice(0, 10)));

        let cursor = wochenStart(new Date());
        if (!wochenMitTraining.has(cursor.toISOString().slice(0, 10))) {
            cursor.setDate(cursor.getDate() - 7);
        }

        let streak = 0;
        while (wochenMitTraining.has(cursor.toISOString().slice(0, 10))) {
            streak++;
            cursor.setDate(cursor.getDate() - 7);
        }
        return streak;
    }

    // Anzahl unterschiedlicher Trainingstage in der aktuellen Kalenderwoche
    function berechneTrainingsDieseWoche() {
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const start = wochenStart(new Date()).getTime();
        const tage = new Set();
        logs.forEach(l => {
            if (wochenStart(parseLogDatum(l)).getTime() === start) {
                tage.add(l.datumISO || l.datum);
            }
        });
        return tage.size;
    }

    // Ermittelt chronologisch alle Bestleistungen (Gewicht hoch oder Wdh bei gleichem Gewicht hoch), neueste zuerst
    function berechneAllePRs() {
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const sortiert = logs.slice().sort((a, b) => (a.datumISO || '').localeCompare(b.datumISO || ''));

        const maxKgProUebung = {};
        const maxWdhBeiKg = {};
        const prs = [];

        sortiert.forEach(l => {
            l.saetze.forEach(s => {
                const bisherMaxKg = maxKgProUebung[l.uebung];
                if (bisherMaxKg === undefined) {
                    maxKgProUebung[l.uebung] = s.kg;
                } else if (s.kg > bisherMaxKg) {
                    maxKgProUebung[l.uebung] = s.kg;
                    prs.push({ uebung: l.uebung, datum: l.datum, datumISO: l.datumISO, text: `${s.kg} kg` });
                }

                const key = l.uebung + '|' + s.kg;
                const bisherMaxWdh = maxWdhBeiKg[key];
                if (bisherMaxWdh === undefined) {
                    maxWdhBeiKg[key] = s.wdh;
                } else if (s.wdh > bisherMaxWdh) {
                    maxWdhBeiKg[key] = s.wdh;
                    prs.push({ uebung: l.uebung, datum: l.datum, datumISO: l.datumISO, text: `${s.wdh}x${s.kg}kg` });
                }
            });
        });

        return prs.sort((a, b) => (b.datumISO || '').localeCompare(a.datumISO || ''));
    }

    function renderDashboard() {
        const box = document.getElementById('dashboard');
        const logs = JSON.parse(localStorage.getItem('logs')) || [];

        if (logs.length === 0) {
            box.innerHTML = `<div class="info-box-label">Übersicht</div><p style="font-size:0.9em; color:#8A8F98; margin:4px 0 0;">Noch keine Trainingsdaten – leg los!</p>`;
            return;
        }

        const streak = berechneWochenStreak();
        const trainingsDieseWoche = berechneTrainingsDieseWoche();
        const prs = berechneAllePRs().slice(0, 3);

        const prsHtml = prs.length ? prs.map(pr => `
            <div class="dashboard-pr">
                <span><strong>${pr.uebung}</strong> – ${pr.text}</span>
                <span class="dashboard-pr-datum">${pr.datum}</span>
            </div>`).join('') : `<p style="font-size:0.85em; color:#8A8F98; margin:6px 0 0;">Noch keine Bestleistungen erfasst.</p>`;

        box.innerHTML = `
            <div class="info-box-label">Übersicht</div>
            <div class="dashboard-stats">
                <div class="dashboard-stat">
                    <div class="dashboard-stat-value">🔥 ${streak}</div>
                    <div class="dashboard-stat-label">Wochen-Streak</div>
                </div>
                <div class="dashboard-stat">
                    <div class="dashboard-stat-value">${trainingsDieseWoche}</div>
                    <div class="dashboard-stat-label">Trainings diese Woche</div>
                </div>
            </div>
            <div style="font-size:0.78em; font-weight:700; color:#8A8F98; text-transform:uppercase; letter-spacing:0.4px; margin-top:4px;">Letzte Bestleistungen</div>
            ${prsHtml}`;
    }
    
    function zeigeHistorie() {
        document.getElementById('wochenBereich').style.display = 'none';
        const logs = JSON.parse(localStorage.getItem('logs')) || [];

        // Ältere Einträge ohne ID nachträglich mit einer ID versehen (für Bearbeiten/Löschen)
        let idErgaenzt = false;
        logs.forEach(l => { if (!l.id) { l.id = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); idErgaenzt = true; } });
        if (idErgaenzt) localStorage.setItem('logs', JSON.stringify(logs));

        const b = document.getElementById('historienBereich');

        if (!document.getElementById('historieFilter')) {
            b.innerHTML = `
                <h3>Historie</h3>
                <select id="historieFilter" onchange="zeigeHistorie()"></select>
                <div id="historieListe"></div>`;
        }

        const filterSelect = document.getElementById('historieFilter');
        const bisherigeAuswahl = filterSelect.value;
        const uebungen = [...new Set(logs.map(l => l.uebung))].sort();
        filterSelect.innerHTML = '<option value="">Alle Übungen</option>' +
            uebungen.map(u => `<option value="${u}">${u}</option>`).join('');
        filterSelect.value = uebungen.includes(bisherigeAuswahl) ? bisherigeAuswahl : "";

        const gefiltert = filterSelect.value ? logs.filter(l => l.uebung === filterSelect.value) : logs;

        document.getElementById('historieListe').innerHTML = renderHistorieGruppiert(gefiltert);
    }

    function renderHistorieGruppiert(eintraege) {
        if (eintraege.length === 0) return "<p>Keine Einträge für diese Auswahl.</p>";

        const tage = {};
        eintraege.forEach(l => {
            const key = l.datumISO || l.datum;
            if (!tage[key]) tage[key] = { datum: l.datum, dauerMinuten: l.dauerMinuten || null, eintraege: [] };
            tage[key].eintraege.push(l);
        });

        const keysSortiert = Object.keys(tage).sort().reverse();

        return keysSortiert.map((key, index) => {
            const tag = tage[key];
            const anzahl = tag.eintraege.length;
            const dauerText = tag.dauerMinuten ? ` · ${formatDauer(tag.dauerMinuten)}` : '';

            const zeilen = tag.eintraege.map(l => `
                <div class="historie-eintrag">
                    <strong>${l.uebung}</strong><br>
                    ${l.saetze.map(s => s.wdh+'x'+s.kg+'kg').join(' | ')}
                    <div style="margin-top:4px;">
                        <button class="klein-btn" style="background: linear-gradient(135deg, #8A6D2E, #C9A34A);" onclick="historieBearbeiten('${l.id}')">✏️ Bearbeiten</button>
                        <button class="klein-btn" style="background:#D9534F;" onclick="historieLoeschen('${l.id}')">🗑️ Löschen</button>
                    </div>
                </div>`).join('');

            return `
                <details class="historie-tag" ${index < 3 ? 'open' : ''}>
                    <summary>${tag.datum} <span class="historie-tag-info">${anzahl} Übung${anzahl !== 1 ? 'en' : ''}${dauerText}</span></summary>
                    ${zeilen}
                </details>`;
        }).join('');
    }

    function historieBearbeiten(id) {
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const eintrag = logs.find(l => l.id === id);
        if (!eintrag) return;
        const eingabe = prompt(`Sätze für "${eintrag.uebung}" (${eintrag.datum}) bearbeiten (Format: Wdh x kg, z.B. 10x40, 8x45):`, saetzeZuString(eintrag.saetze));
        if (eingabe === null) return;
        const neu = stringZuSaetze(eingabe);
        if (neu.length === 0) { alert('Keine gültigen Sätze erkannt.'); return; }
        eintrag.saetze = neu;
        localStorage.setItem('logs', JSON.stringify(logs));
        zeigeHistorie();
    }

    function historieLoeschen(id) {
        if (!confirm('Diesen Eintrag wirklich löschen?')) return;
        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem('logs', JSON.stringify(logs));
        zeigeHistorie();
    }

    function zeigeWochenuebersicht() {
        document.getElementById('historienBereich').innerHTML = '';
        const logs = JSON.parse(localStorage.getItem('logs')) || [];
        const b = document.getElementById('wochenBereich');
        b.style.display = 'block';

        if (logs.length === 0) {
            b.innerHTML = "<h3>Wochenübersicht</h3><p>Noch keine Daten vorhanden.</p>";
            return;
        }

        const wochen = {};
        logs.forEach(l => {
            const start = wochenStart(parseLogDatum(l));
            const key = start.toISOString().slice(0, 10);
            if (!wochen[key]) wochen[key] = { start, gruppen: {}, tage: {} };
            const gruppe = l.gruppe || findGruppe(l.uebung);
            if (!wochen[key].gruppen[gruppe]) wochen[key].gruppen[gruppe] = { saetze: 0, volumen: 0 };
            l.saetze.forEach(s => {
                wochen[key].gruppen[gruppe].saetze++;
                wochen[key].gruppen[gruppe].volumen += (s.wdh * s.kg);
            });

            const tagKey = l.datumISO || l.datum;
            if (!wochen[key].tage[tagKey]) wochen[key].tage[tagKey] = { datum: l.datum, uebungen: {}, dauerMinuten: l.dauerMinuten || null };
            if (!wochen[key].tage[tagKey].uebungen[l.uebung]) wochen[key].tage[tagKey].uebungen[l.uebung] = [];
            wochen[key].tage[tagKey].uebungen[l.uebung].push(...l.saetze);
        });

        const keysSortiert = Object.keys(wochen).sort().reverse();

        b.innerHTML = "<h3>Wochenübersicht</h3>" + keysSortiert.map(key => {
            const w = wochen[key];
            const ende = new Date(w.start);
            ende.setDate(ende.getDate() + 6);
            const von = w.start.toLocaleDateString('de-DE');
            const bis = ende.toLocaleDateString('de-DE');
            const zeilen = Object.entries(w.gruppen)
                .sort((a, b) => b[1].saetze - a[1].saetze)
                .map(([g, werte]) => `<tr><td>${g}</td><td>${werte.saetze}</td><td>${werte.volumen} kg</td></tr>`)
                .join('');

            const tageSortiert = Object.keys(w.tage).sort().reverse();
            const trainingstage = tageSortiert.length;
            const gesamtdauer = Object.values(w.tage).reduce((sum, t) => sum + (t.dauerMinuten || 0), 0);
            const kennzahlen = `${trainingstage} Trainingstag${trainingstage !== 1 ? 'e' : ''}` + (gesamtdauer ? ` · ${formatDauer(gesamtdauer)}` : '');

            const tageHtml = tageSortiert.map(tk => {
                const tag = w.tage[tk];
                const chips = Object.entries(tag.uebungen).map(([u, saetze]) => `
                    <div class="uebung-chip">
                        <div class="uebung-chip-name">${u}</div>
                        <div class="uebung-chip-saetze">${saetze.map(s => `${s.wdh}x${s.kg}kg`).join(', ')}</div>
                    </div>`).join('');
                return `<div style="margin-top:10px;"><div style="font-size:0.8em; font-weight:700; color:#3A3F45; margin-bottom:6px;">${tag.datum}</div><div class="tag-uebungen">${chips}</div></div>`;
            }).join('');

            return `
                <div class="info-box">
                    <strong>${von} – ${bis}</strong>
                    <div style="color:#8A8F98; font-size:0.85em; margin-top:2px;">${kennzahlen}</div>
                    <table>
                        <thead><tr><th>Muskelgruppe</th><th>Sätze</th><th>Volumen</th></tr></thead>
                        <tbody>${zeilen}</tbody>
                    </table>
                    ${tageHtml}
                </div>`;
        }).join('');
    }

    function datenExportieren() {
        const daten = {
            logs: JSON.parse(localStorage.getItem('logs')) || [],
            plaene: JSON.parse(localStorage.getItem('plaene')) || {}
        };
        const blob = new Blob([JSON.stringify(daten, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gym-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function datenImportieren(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const daten = JSON.parse(e.target.result);
                if (!daten.logs && !daten.plaene) { alert('Das sieht nicht nach einer gültigen Backup-Datei aus.'); return; }
                if (!confirm('Import überschreibt die aktuellen Trainingsdaten und Pläne auf diesem Gerät. Fortfahren?')) return;
                if (daten.logs) localStorage.setItem('logs', JSON.stringify(daten.logs));
                if (daten.plaene) localStorage.setItem('plaene', JSON.stringify(daten.plaene));
                alert('Import erfolgreich!');
                location.reload();
            } catch (err) {
                alert('Datei konnte nicht gelesen werden. Ist es eine gültige Backup-Datei?');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function loescheDaten() { if(confirm("Alles löschen?")) { localStorage.removeItem('logs'); localStorage.removeItem('aktuellesTraining'); location.reload(); } }
</script>
